[package]
name = "mxd2qgz"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3"]

[dependencies]
cfb = "0.7.3"
pyo3 = { version = "0.29.0", optional = true }
tempfile = "3.24"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
roxmltree = "0.20"
